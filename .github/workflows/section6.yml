name: Section-six CPU contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s research/section6 -p 'test_*.py' -v
      - run: python research/section6/native_cycle/test_helper.py --out /tmp/native-helper.json
      - run: python -m compileall -q research/section6
      - name: Reproduce archived GPU evidence on CPU
        run: python research/section6/reproduce.py --out /tmp/section6-cpu-reproduction
      - name: Assemble reviewed delivery
        run: python research/section6/package_delivery.py --receipt /tmp/section6-cpu-reproduction/REPRODUCTION.json --out section6-delivery.zip
      - uses: actions/upload-artifact@v4
        with:
          name: section6-reviewed-delivery
          path: section6-delivery.zip
          retention-days: 14
