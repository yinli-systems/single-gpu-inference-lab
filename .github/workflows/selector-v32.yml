name: Selector v3.2 native-policy contracts
on:
  push:
    paths: ['research/selector_v32/**', '.github/workflows/selector-v32.yml']
  pull_request:
    paths: ['research/selector_v32/**', '.github/workflows/selector-v32.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python -m unittest discover -s research/selector_v32 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/selector_v32/fallback_audit -p 'test_*.py' -v
      - run: python -m compileall -q research/selector_v32
      - run: bash -n research/selector_v32/run.sbatch
      - run: git diff --check
      - name: Retain CPU/source packet, not a GPU verdict
        uses: actions/upload-artifact@v4
        with:
          name: selector-v32-source-contracts
          path: research/selector_v32/
          retention-days: 14
          if-no-files-found: error
