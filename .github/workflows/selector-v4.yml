name: Selector v4 safe autotune contracts
on:
  push:
    paths: ['research/selector_v4/**', '.github/workflows/selector-v4.yml']
  pull_request:
    paths: ['research/selector_v4/**', '.github/workflows/selector-v4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python -m unittest discover -s research/selector_v4 -p 'test_*.py' -v
      - run: python -m compileall -q research/selector_v4 research/selector_v32
      - run: bash -n research/selector_v4/run_v4.sbatch
      - name: Rebuild frozen manifest
        run: |
          PYTHONPATH=. python -m research.selector_v4.generate_manifest --repo . --out /tmp/selector-v4-manifest.json >/tmp/selector-v4-generator-output.json
          cmp research/selector_v4/manifest.json /tmp/selector-v4-manifest.json
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: selector-v4-source-contracts
          path: research/selector_v4/
          retention-days: 14
          if-no-files-found: error
