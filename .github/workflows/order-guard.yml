name: Order guard evidence audit
on:
  push:
    branches: [kevin/locality-guard-20260929]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Audit immutable historical archive (no GPU)
        run: |
          mkdir -p /tmp/order-guard-export
          python - <<'PY'
          import hashlib,json,tarfile
          from pathlib import Path,PurePosixPath
          root=Path('benchmarks/results/plan-order-mechanism')
          archive=root/'raw-evidence.tar.gz'
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest=='70ba29c0e70e1178cc296996bfbc98cefbc52953744d727aabb4545f0c96410b'
          seen=set();runs={}
          with tarfile.open(archive,'r:gz') as tf:
              for m in tf:
                  p=PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert m.name not in seen;seen.add(m.name)
                  if not m.isfile():
                      assert m.isdir();continue
                  assert m.size<=64*1024*1024
                  if p.name not in ('plans.json','measurements.json','environment.json','complete.json'):continue
                  value=json.load(tf.extractfile(m))
                  runs.setdefault(str(p.parent),{})[p.name]=value
          out={'archive_sha256':digest,'members':len(seen),'GPU_rerun':False,'runs':[]}
          for path,files in sorted(runs.items()):
              if 'measurements.json' not in files:continue
              env=files.get('environment.json',{})
              row={'path':path,'gpu':env.get('gpu'),'rows':len(files['measurements.json']), 'plans':len(files.get('plans.json',[])),'first_row':files['measurements.json'][0]}
              out['runs'].append(row)
              for plan in files.get('plans.json',[]):
                  if plan.get('case')=='holdout-01' and plan.get('state')=='opposite' and plan.get('split')=='unsplit' and plan.get('dtype')=='float16':
                      plan=dict(plan)
                      inner=dict(plan.get('plan',plan.get('baseline',{})))
                      descriptors=inner.pop('descriptors',[])
                      inner['descriptor_count']=len(descriptors);inner['first_descriptors']=descriptors[:8];inner['last_descriptors']=descriptors[-8:]
                      plan['plan']=inner;row['adverse_plan']=plan
          Path('/tmp/order-guard-export/audit.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Run improvement contracts when present
        run: |
          if [ -f research/order_guard/test_order_guard.py ]; then
            python -m unittest discover -s research/order_guard -p 'test_*.py' -v
            python research/order_guard/stress.py --out /tmp/order-guard-export/stress.json
            python research/order_guard/analyze_archive.py --out /tmp/order-guard-export/development-analysis.json
          fi
      - name: Export auditable evidence and research sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-guard-cpu-evidence
          path: |
            /tmp/order-guard-export/
            benchmarks/results/plan-order-mechanism/
            research/order_guard/
          retention-days: 3
          if-no-files-found: error
