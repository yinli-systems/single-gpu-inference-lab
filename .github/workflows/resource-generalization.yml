name: Resource generalization CPU contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install numpy aiohttp
      - run: python -m unittest discover -s research/resource_generalization -p 'test_*.py' -v
      - run: python -m unittest discover -s research/resource_generalization/analysis -p 'test_*.py' -v
      - run: python -m unittest discover -s research/resource_generalization/serving -p 'test_*.py' -v
      - run: python -m unittest discover -s research/resource_generalization/numerics -p 'test_*.py' -v
      - run: python -m compileall -q research/resource_generalization
      - run: bash -n research/resource_generalization/run.sbatch && bash -n research/resource_generalization/serving/run.sbatch
